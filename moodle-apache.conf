# Moodle 5.2 VirtualHost configuration
# Replaces 000-default.conf (a2dissite 000-default in Dockerfile).
#
# Router configuration per https://docs.moodle.org/502/en/Configuring_the_Router
# DirectoryIndex index.php must appear directly above FallbackResource /r.php.

<VirtualHost *:80>
    # APACHE_DOCUMENT_ROOT is set to /var/www/html/public via ENV in Dockerfile.
    # The base image expands it at runtime - use the literal value here so it
    # is also correct at build time when a2ensite runs.
    DocumentRoot /var/www/html/public

    # Moodle 5.1+ public web root
    <Directory "/var/www/html/public">
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted

        # Required by Moodle 5.2 router (front controller).
        # DirectoryIndex must be set immediately before FallbackResource.
        DirectoryIndex index.php
        FallbackResource /r.php
    </Directory>

    # Deny direct HTTP access to the repo root.
    # config.php, lib/, admin/cli/ live here but must never be web-accessible.
    <Directory "/var/www/html">
        Options -Indexes -FollowSymLinks
        AllowOverride None
        Require all denied
    </Directory>

    # Re-allow public/ (subdirectory of the denied repo root above).
    <Directory "/var/www/html/public">
        Require all granted
    </Directory>

    # Route errors through Moodle's error handler
    ErrorDocument 404 /error/index.php
    ErrorDocument 403 /error/index.php?code=404

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>